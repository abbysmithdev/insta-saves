<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="saved-posts-board" content="1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saved Posts">
<meta name="theme-color" content="#f7f3ee">
<title>Saved Posts Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ee; --panel:#fffdfa; --ink:#2a2420; --muted:#7b7068; --line:#e8dfd5;
  --accent:#c2410c; --accent-soft:#fde7da; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel)}
.brand{font-family:Fraunces,serif;font-weight:650;font-size:22px;letter-spacing:-.01em;padding:0 8px 2px}
.brand-sub{color:var(--muted);font-size:12px;padding:0 8px 18px}
.navlabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 8px 6px;display:flex;justify-content:space-between;align-items:center}
.navlabel button{border:0;background:none;color:var(--accent);font-size:12px;text-transform:none;letter-spacing:0;font-weight:600;padding:2px 4px}
.nav{list-style:none;margin:0;padding:0}
.nav li{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;cursor:pointer;user-select:none;border:1.5px solid transparent}
.nav li:hover{background:#f3ece4}
.nav li.on{background:var(--accent-soft);font-weight:600}
.nav li.drop{border-color:var(--accent);background:var(--accent-soft)}
.nav .dot{width:10px;height:10px;border-radius:3px;flex:none}
.nav .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .ct{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.nav .more{opacity:0;border:0;background:none;padding:0 2px;color:var(--muted)}
.nav li:hover .more{opacity:1}
.side-foot{margin-top:22px;padding:0 8px;display:flex;flex-direction:column;gap:6px}
.linkbtn{border:0;background:none;text-align:left;padding:4px 0;color:var(--muted);font-size:13px}
.linkbtn:hover{color:var(--ink)}
.helper{font-size:12px;color:var(--muted);padding:12px 8px 0;display:flex;align-items:center;gap:7px}
.helper i{width:8px;height:8px;border-radius:50%;background:#cbbfb3;display:inline-block}
.helper.on i{background:#16a34a}
.main{padding:22px 28px 90px;min-width:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.title{font-family:Fraunces,serif;font-size:30px;font-weight:650;letter-spacing:-.015em;margin:0;flex:1;min-width:180px}
.count{color:var(--muted);margin-bottom:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:180px;max-width:340px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.sel{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.btn{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500;text-decoration:none;display:inline-block}
.btn:hover{border-color:#d6c9bb}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#a8370a}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:#b91c1c}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;position:relative;transition:transform .12s ease, box-shadow .12s ease;border:2px solid transparent}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(60,40,20,.08),0 10px 24px rgba(60,40,20,.1)}
.card.picked{border-color:var(--accent)}
.card.dragging{opacity:.5}
.thumb{aspect-ratio:4/5;display:flex;align-items:flex-end;padding:12px;position:relative;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .ini{font-family:Fraunces,serif;font-size:44px;font-weight:650;color:rgba(255,255,255,.92);line-height:1;text-shadow:0 1px 6px rgba(0,0,0,.12)}
.badge{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.88);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600}
.check{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.9);border:2px solid #fff;display:none;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;z-index:1}
.selecting .check{display:flex}
.card.picked .check{background:var(--accent);border-color:var(--accent)}
.cbody{padding:10px 12px 12px}
.cbody:empty{display:none}
.user{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{color:var(--muted);font-size:12px}
.note{margin-top:4px;font-size:13px;color:#4a403a;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;background:#f1ebe4;display:inline-flex;align-items:center;gap:5px}
.chip i{width:7px;height:7px;border-radius:2px;display:inline-block}
.more-row{text-align:center;margin-top:24px}
.empty{max-width:560px;margin:60px auto;text-align:center}
.empty h2{font-family:Fraunces,serif;font-size:26px;margin:0 0 8px}
.empty p{color:var(--muted)}
.bulk{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px 10px 18px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;flex-wrap:wrap;max-width:calc(100vw - 24px)}
.bulk .btn{background:#3b332e;border-color:#3b332e;color:#fff}
.bulk select{background:#3b332e;border-color:#3b332e;color:#fff}
.scrim{position:fixed;inset:0;background:rgba(30,20,10,.35);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--panel);border-radius:18px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-family:Fraunces,serif;font-size:22px;margin:0 0 10px}
.modal p{color:var(--muted);margin:6px 0 12px}
.modal ol{padding-left:20px;color:#4a403a;margin:8px 0 14px}
.modal ol li{margin:4px 0}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.field{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea.field{min-height:80px;resize:vertical}
.drop-zone{border:2px dashed #d9cbbd;border-radius:14px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;margin:6px 0}
.drop-zone.over{border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:flex;gap:8px;margin-top:10px}
.sw{width:26px;height:26px;border-radius:8px;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--ink)}
.blist{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.blist label{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
.blist label:hover{background:#f3ece4}
.dimg{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;background:#f1ebe4;display:block;margin-bottom:12px}
.small{font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
code{background:#f1ebe4;padding:1px 5px;border-radius:5px;font-size:12px}
.menu{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;z-index:50;min-width:150px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px}
.menu button:hover{background:#f3ece4}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;z-index:60;font-size:13px;max-width:90vw}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}
  .brand-sub{padding-bottom:6px}
  .nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .nav li{flex:none;background:#f3ece4}
  .nav .more{display:none}
  .side-foot{flex-direction:row;flex-wrap:wrap;gap:14px;margin-top:10px}
  .main{padding:16px 12px 100px}
  .title{font-size:24px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .cbody{padding:8px 10px 10px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
/* ============================================================
   Saved Posts Board
   - Posts, boards and notes live in localStorage.
   - Thumbnails live in IndexedDB (they're too big for localStorage).
   - The "Saved Posts Collector" userscript talks to this page with
     window.postMessage (JSON strings tagged spb:true).
   ============================================================ */
const COLORS=["#c2410c","#be185d","#7c3aed","#2563eb","#0f766e","#4d7c0f","#b45309","#475569"];
const LOCAL_KEY="saved-posts-board-v2";
const PAGE=120;
const THUMB_MAX=360;

let state={boards:[],posts:{},igUser:""};
let view={board:"all",sort:"saved-desc",q:"",type:"all",selecting:false,picked:new Set(),limit:PAGE};
let thumbs=new Map();          // code -> data URL
let helper={on:false};
let storageOK=true, saveTimer=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const nowS=()=>Math.floor(Date.now()/1000);
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function grad(name){const h=hash(name||"?")%360;return `linear-gradient(135deg,hsl(${h} 62% 68%),hsl(${(h+40)%360} 58% 56%))`}
function fmtDate(ts){return new Date(ts*1000).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}
const TYPE_LABEL={p:"Post",reel:"Reel",tv:"Video"};
function postUrl(p){return `https://www.instagram.com/${p.k==="reel"?"reel":p.k==="tv"?"tv":"p"}/${p.c}/`}
function who(p){return p.u?"@"+p.u:(p.au||"")}
function toast(msg){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

/* ---------------- storage ---------------- */
function load(){
  try{const raw=localStorage.getItem(LOCAL_KEY);if(raw){const s=JSON.parse(raw);if(s&&s.posts)state=Object.assign({boards:[],posts:{},igUser:""},s)}}
  catch(e){storageOK=false}
}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{
  try{localStorage.setItem(LOCAL_KEY,JSON.stringify(state));storageOK=true}
  catch(e){storageOK=false;toast("Couldn't save. Storage may be full or blocked.")}
},400)}
/* tiny IndexedDB wrapper for thumbnails */
let dbP=null;
function idb(){
  if(!dbP)dbP=new Promise((res,rej)=>{try{const r=indexedDB.open("saved-posts-board",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("thumbs");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
  return dbP;
}
async function thumbPut(code,data){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction("thumbs","readwrite");tx.objectStore("thumbs").put(data,code);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
async function thumbDel(codes){try{const db=await idb();const tx=db.transaction("thumbs","readwrite");codes.forEach(c=>tx.objectStore("thumbs").delete(c))}catch(e){}}
async function thumbLoadAll(){
  try{const db=await idb();await new Promise((res,rej)=>{
    const tx=db.transaction("thumbs","readonly"),st=tx.objectStore("thumbs");const req=st.openCursor();
    req.onsuccess=()=>{const c=req.result;if(c){thumbs.set(c.key,c.value);c.continue()}else res()};req.onerror=()=>rej(req.error)})}catch(e){}
}

/* ---------------- merging data in ---------------- */
const URL_RE=/instagram\.com\/(?:[A-Za-z0-9_.]+\/)?(p|reels?|tv)\/([A-Za-z0-9_-]{5,})/;
function parseUrl(s){const m=URL_RE.exec(s||"");if(!m)return null;return {k:m[1].startsWith("reel")?"reel":m[1],c:m[2]}}
function ensureBoard(name){
  let b=state.boards.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!b){b={id:uid(),name,color:COLORS[state.boards.length%COLORS.length]};state.boards.push(b)}
  return b;
}
function newPost(o){return Object.assign({c:o.c,k:o.k||"p",u:"",au:"",cap:"",iu:"",t:null,s:null,a:nowS(),b:[],n:""},o)}

/* From the collector: items are in Instagram's saved order, newest first.
   Instagram doesn't say WHEN things were saved, so each post gets a sort
   key (s) that keeps that order. Posts we already know (or that have a
   real date from an export) act as anchors; new posts are slotted between them. */
function mergeCollected(batch){
  const items=batch.items||[];const n=items.length;const now=nowS();
  let added=0;const needThumb=[];
  const anchorVal=i=>{const p=state.posts[items[i].c];return p&&p.s!=null?p.s:null};
  let upper=now,prev=-1;
  for(let i=0;i<=n;i++){
    const av=i<n?anchorVal(i):null;
    if(i<n&&av==null)continue;
    const count=i-prev-1;
    for(let j=1;j<=count;j++){
      const it=items[prev+j];let val;
      if(av!=null){let up=Math.max(upper,av+count+1);val=up-(up-av)*j/(count+1)}
      else val=upper-j*60;
      let p=state.posts[it.c];
      if(!p){p=newPost({c:it.c,k:it.k});state.posts[it.c]=p;added++}
      if(p.s==null)p.s=val;
    }
    if(i<n){upper=av;prev=i}
  }
  items.forEach(it=>{const p=state.posts[it.c];if(!p)return;
    if(it.iu)p.iu=it.iu;if(it.cap&&!p.cap)p.cap=it.cap;if(it.au&&!p.au)p.au=it.au;if(it.k==="reel")p.k="reel";
    if(!thumbs.has(p.c)&&p.iu)needThumb.push({c:p.c,iu:p.iu});
  });
  let board=null;
  if(batch.collection){board=ensureBoard(batch.collection);items.forEach(it=>{const p=state.posts[it.c];if(p&&!p.b.includes(board.id))p.b.push(board.id)})}
  if(batch.user)state.igUser=batch.user;
  save();
  return {added,needThumb,board,total:n};
}
/* From Instagram's "Download your information" export (optional, gives real dates) */
function walk(o,fn){if(o&&typeof o==="object"){fn(o);for(const k in o)walk(o[k],fn)}}
function entryInfo(entry){
  let url=null,ts=null,name=null;
  walk(entry,o=>{for(const k in o){const v=o[k];
    if(typeof v==="string"&&!url){const u=parseUrl(v);if(u)url=u}
    if(k==="timestamp"&&typeof v==="number"&&!ts)ts=v>1e12?Math.round(v/1000):v;}});
  const smd=entry.string_map_data||{};
  if(smd.Name&&typeof smd.Name.value==="string")name=smd.Name.value;
  const user=typeof entry.title==="string"&&entry.title!=="Collection"?entry.title:name;
  return {url,ts,user,name};
}
function parseExport(json,fname){
  const out={posts:[],collections:[]};let arr=null,isColl=/collection/i.test(fname||"");
  if(Array.isArray(json))arr=json;else if(json&&typeof json==="object"){for(const k in json){if(Array.isArray(json[k])){arr=json[k];if(/collection/i.test(k))isColl=true;break}}}
  if(!arr)return out;
  if(isColl){let cur=null;arr.forEach(e=>{const info=entryInfo(e);
      if(!info.url){const nm=info.name||(e.title&&e.title!=="Collection"?e.title:null);if(nm){cur={name:nm,items:[]};out.collections.push(cur)}}
      else{if(!cur){cur={name:"Imported collection",items:[]};out.collections.push(cur)}cur.items.push({...info.url,u:info.user||"",t:info.ts})}});
  }else arr.forEach(e=>{const info=entryInfo(e);if(info.url)out.posts.push({...info.url,u:info.user||"",t:info.ts})});
  return out;
}
function mergeExport(res){
  let added=0,boardsMade=0;const before=state.boards.length;
  const upsert=it=>{let p=state.posts[it.c];
    if(!p){p=newPost({c:it.c,k:it.k,u:it.u||"",t:it.t||null,s:it.t||null});state.posts[it.c]=p;added++}
    if(!p.u&&it.u)p.u=it.u;
    if(it.t&&!p.t){p.t=it.t;p.s=it.t}
    return p};
  res.posts.forEach(upsert);
  res.collections.forEach(col=>{const b=ensureBoard(col.name);col.items.forEach(it=>{const p=upsert(it);if(!p.b.includes(b.id))p.b.push(b.id)})});
  boardsMade=state.boards.length-before;
  // posts with no date at all go to the bottom of "newest first"
  Object.values(state.posts).forEach(p=>{if(p.s==null)p.s=0});
  save();return {added,boardsMade};
}

/* ---------------- talking to the collector userscript ---------------- */
function toScript(type,data){window.postMessage(JSON.stringify(Object.assign({spb:true,dir:"toScript",type},data||{})),location.origin)}
function hello(){toScript("hello",{known:Object.keys(state.posts),app:location.href.split("#")[0]})}
let thumbsReady=null;
window.addEventListener("message",async e=>{
  if(e.origin!==location.origin||typeof e.data!=="string")return;
  let m;try{m=JSON.parse(e.data)}catch(_){return}
  if(!m||!m.spb||m.dir!=="toPage")return;
  await thumbsReady;
  if(m.type==="ready"){if(!helper.on){helper.on=true;updateHelper()}hello();askMissingThumbs()}
  if(m.type==="import"){
    helper.on=true;
    const r=mergeCollected(m.batch);
    toScript("ack",{id:m.batch.id,thumbs:r.needThumb});
    hello();render();
    toast(r.added?`${r.added} new saved ${r.added===1?"post":"posts"} added${r.board?` to "${r.board.name}"`:""}`:r.board?`Updated "${r.board.name}"`:"You're up to date");
  }
  if(m.type==="thumb"&&m.c&&m.data){
    const small=await shrink(m.data).catch(()=>null);if(!small)return;
    thumbs.set(m.c,small);thumbPut(m.c,small);
    const card=document.querySelector(`.card[data-post="${CSS.escape(m.c)}"] .thumb`);
    if(card&&!card.querySelector("img")){const img=new Image();img.alt="";img.src=small;card.prepend(img);const ini=card.querySelector(".ini");ini&&ini.remove()}
  }
});
function askMissingThumbs(){
  const need=Object.values(state.posts).filter(p=>p.iu&&!thumbs.has(p.c)).map(p=>({c:p.c,iu:p.iu}));
  if(need.length)toScript("fetchThumbs",{thumbs:need});
}
function shrink(dataUrl){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{
  const sc=Math.min(1,THUMB_MAX/Math.max(img.width,img.height));const w=Math.round(img.width*sc),h=Math.round(img.height*sc);
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);res(cv.toDataURL("image/jpeg",.78))};
  img.onerror=rej;img.src=dataUrl})}
function updateHelper(){const el=$("#helper");if(el){el.className="helper"+(helper.on?" on":"");el.querySelector("span").textContent=helper.on?"Collector connected":"Collector not detected"}}
function collectUrl(){return state.igUser?`https://www.instagram.com/${encodeURIComponent(state.igUser)}/saved/all-posts/#spb-collect`:"https://www.instagram.com/"}

/* ---------------- derived ---------------- */
function boardById(id){return state.boards.find(b=>b.id===id)}
function filtered(){
  let list=Object.values(state.posts);
  if(view.board==="unsorted")list=list.filter(p=>!p.b.length);
  else if(view.board!=="all")list=list.filter(p=>p.b.includes(view.board));
  if(view.type!=="all")list=list.filter(p=>p.k===view.type);
  const q=view.q.trim().toLowerCase();
  if(q)list=list.filter(p=>[p.u,p.au,p.n,p.cap].some(x=>(x||"").toLowerCase().includes(q)));
  const s=view.sort,sv=p=>p.s||0;
  list.sort((a,b)=>{
    if(s==="saved-desc")return sv(b)-sv(a)||b.a-a.a;
    if(s==="saved-asc")return sv(a)-sv(b)||a.a-b.a;
    if(s==="added-desc")return b.a-a.a||sv(b)-sv(a);
    if(s==="user")return (who(a)||"~").replace("@","").localeCompare((who(b)||"~").replace("@",""))||sv(b)-sv(a);
    return 0});
  return list;
}

/* ---------------- render ---------------- */
function render(){
  const all=Object.values(state.posts);
  const counts={all:all.length,unsorted:all.filter(p=>!p.b.length).length};
  state.boards.forEach(b=>counts[b.id]=0);all.forEach(p=>p.b.forEach(id=>{if(id in counts)counts[id]++}));
  if(view.board!=="all"&&view.board!=="unsorted"&&!boardById(view.board))view.board="all";
  const list=filtered();
  const cur=view.board==="all"?"All saved posts":view.board==="unsorted"?"Not on a board":boardById(view.board).name;
  const navItem=(id,name,color,isBoard)=>`<li data-nav="${esc(id)}" class="${view.board===id?"on":""}" ${isBoard?`data-board="${esc(id)}"`:""}>
      <span class="dot" style="background:${color}"></span><span class="name">${esc(name)}</span><span class="ct">${counts[id]||0}</span>
      ${isBoard?`<button class="more" data-bmenu="${esc(id)}" title="Board options">&#8943;</button>`:""}</li>`;
  $("#app").innerHTML=`<div class="app">
  <aside class="side">
    <div class="brand">Saved Posts</div>
    <div class="brand-sub">Your Instagram saves, organized</div>
    <ul class="nav">${navItem("all","All saved","#2a2420")}${navItem("unsorted","Not on a board","#cbbfb3")}</ul>
    <div class="navlabel"><span>Boards</span><button id="newBoard">+ New</button></div>
    <ul class="nav">${state.boards.map(b=>navItem(b.id,b.name,b.color,true)).join("")||`<li style="cursor:default;color:var(--muted);font-size:13px">No boards yet</li>`}</ul>
    <div class="side-foot">
      <button class="linkbtn" id="settingsBtn">&#9881;&#xFE0E; Settings</button>
    </div>
    <div id="helper" class="helper${helper.on?" on":""}"><i></i><span>${helper.on?"Collector connected":"Collector not detected"}</span></div>
    ${storageOK?"":`<div class="helper" style="color:#b91c1c">Changes aren't being saved in this browser</div>`}
  </aside>
  <main class="main">
    <div class="top"><h1 class="title">${esc(cur)}</h1>
      ${all.length?`<button class="btn ${view.selecting?"on":""}" id="selBtn">${view.selecting?"Done":"Select"}</button>`:""}
      <a class="btn primary" id="getNew" href="${esc(collectUrl())}">Get new saves</a></div>
    ${all.length?`<div class="count">${list.length.toLocaleString()} ${list.length===1?"post":"posts"}</div>
    <div class="tools">
      <input class="search" id="q" placeholder="Search notes, accounts, descriptions" value="${esc(view.q)}">
      <select class="sel" id="sort">
        <option value="saved-desc">Newest saved first</option>
        <option value="saved-asc">Oldest saved first</option>
        <option value="added-desc">Recently added here</option>
        <option value="user">Account A to Z</option>
      </select>
      <select class="sel" id="type"><option value="all">All types</option><option value="p">Posts</option><option value="reel">Reels</option><option value="tv">Videos</option></select>
    </div>
    <div class="grid ${view.selecting?"selecting":""}" id="grid">${list.slice(0,view.limit).map(cardHTML).join("")}</div>
    ${list.length>view.limit?`<div class="more-row"><button class="btn" id="moreBtn">Show more (${(list.length-view.limit).toLocaleString()} left)</button></div>`:""}
    ${!list.length?`<div class="empty"><p>${view.board!=="all"&&!view.q?"Nothing on this board yet. Open a post to add it, or use Select to add several at once.":"No posts match."}</p></div>`:""}
    `:emptyHTML()}
  </main></div>
  ${view.selecting&&view.picked.size?bulkHTML():""}`;
  const so=$("#sort");if(so)so.value=view.sort;const ty=$("#type");if(ty)ty.value=view.type;
}
function initial(p){return (who(p)||"?").replace(/^[@._]+/,"").charAt(0).toUpperCase()||"?"}
function cardHTML(p){
  const img=thumbs.get(p.c);const w=who(p);
  const body=`${w?`<div class="user">${esc(w)}</div>`:""}${p.t?`<div class="date">Saved ${esc(fmtDate(p.t))}</div>`:""}
      ${p.n?`<div class="note">${esc(p.n)}</div>`:""}
      ${p.b.length?`<div class="chips">${p.b.map(id=>{const b=boardById(id);return b?`<span class="chip"><i style="background:${b.color}"></i>${esc(b.name)}</span>`:""}).join("")}</div>`:""}`.trim();
  return `<div class="card ${view.picked.has(p.c)?"picked":""}" data-post="${esc(p.c)}" draggable="true">
    <div class="thumb" style="background:${grad(w||p.c)}">${img?`<img alt="" src="${img}">`:`<span class="ini">${esc(initial(p))}</span>`}
      <span class="badge">${TYPE_LABEL[p.k]||"Post"}</span><span class="check">&#10003;</span></div>
    <div class="cbody">${body}</div></div>`;
}
function emptyHTML(){
  return `<div class="empty"><h2>Bring in your saved posts</h2>
  <p>${helper.on?`The collector is installed. Tap <b>Get new saves</b>, sign in to Instagram if asked, and open your Saved page. It will gather everything and bring you back here.`
  :`To pull in your saves, install the Saved Posts Collector first. It's a one-time setup that takes a couple of minutes.`}</p>
  <p style="margin-top:18px">${helper.on?`<a class="btn primary" href="${esc(collectUrl())}">Get new saves</a>`:`<button class="btn primary" id="setupBtn2">Install the collector</button>`}</p></div>`;
}
function bulkHTML(){
  const inBoard=view.board!=="all"&&view.board!=="unsorted";
  return `<div class="bulk"><span>${view.picked.size} selected</span>
    <select class="sel" id="bulkBoard"><option value="">Add to board...</option>${state.boards.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("")}<option value="__new">+ New board</option></select>
    ${inBoard?`<button class="btn" id="bulkRemove">Remove from board</button>`:""}
    <button class="btn" id="bulkDelete">Delete</button><button class="btn" id="bulkClear">Clear</button></div>`;
}

/* ---------------- modals ---------------- */
function openModal(html,onMount){
  closeModal();const s=document.createElement("div");s.className="scrim";s.id="scrim";s.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener("mousedown",e=>{if(e.target===s)closeModal()});document.body.appendChild(s);onMount&&onMount(s);
}
function closeModal(){const s=$("#scrim");s&&s.remove()}
function confirmBox(title,msg,okLabel,cb){
  openModal(`<h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="row"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" id="okc">${esc(okLabel)}</button></div>`,s=>{
    s.querySelector("[data-x]").onclick=closeModal;s.querySelector("#okc").onclick=()=>{closeModal();cb()}});
}
function boardForm(board,cb){
  let color=board?board.color:COLORS[state.boards.length%COLORS.length];
  openModal(`<h3>${board?"Edit board":"New board"}</h3>
    <input class="field" id="bname" placeholder="e.g. Recipes, Outfits, Trip ideas" value="${esc(board?board.name:"")}" maxlength="60">
    <div class="swatches">${COLORS.map(c=>`<span class="sw ${c===color?"on":""}" data-c="${c}" style="background:${c}"></span>`).join("")}</div>
    <div class="row"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" id="bsave">${board?"Save":"Create board"}</button></div>`,s=>{
    s.querySelectorAll(".sw").forEach(el=>el.onclick=()=>{color=el.dataset.c;s.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===el))});
    const go=()=>{const name=s.querySelector("#bname").value.trim();if(!name)return;
      if(board){board.name=name;board.color=color}else{board={id:uid(),name,color};state.boards.push(board)}
      save();closeModal();cb&&cb(board);render()};
    s.querySelector("#bsave").onclick=go;s.querySelector("#bname").onkeydown=e=>{if(e.key==="Enter")go()};s.querySelector("[data-x]").onclick=closeModal;
    s.querySelector("#bname").focus();
  });
}
function scriptUrl(){return new URL("saved_posts_collector.user.js",location.href).href}

  openModal(`<h3>Settings</h3>
  <div style="font-weight:600;margin-top:4px">Collector</div>
  <p style="margin-top:2px">The collector is a small script that runs on Instagram's website and sends your saved posts here. Status: <b style="color:${helper.on?"#16a34a":"var(--ink)"}">${helper.on?"connected":"not installed in this browser yet"}</b></p>
  <a class="btn primary" href="${esc(scriptUrl())}" target="_blank" rel="noopener">${helper.on?"Reinstall or update collector":"Install Collector"}</a>
  <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:500">How to install it</summary>
    <div style="font-weight:600;margin-top:10px">iPhone or iPad</div>
    <ol><li>Get the free <b>Userscripts</b> app from the App Store and open it once.</li>
      <li>Open the iPhone Settings app &gt; Apps &gt; Safari &gt; Extensions &gt; Userscripts. Turn it on and allow it on all websites.</li>
      <li>Back here in Safari, tap <b>Install Collector</b>. A page of code opens; that's normal.</li>
      <li>Tap the extensions button in Safari's address bar, choose <b>Userscripts</b>, then <b>Install</b>.</li>
      <li>Return to this page and reload it. The dot at the bottom of the menu turns green.</li></ol>
    <div style="font-weight:600">Android</div>
    <ol><li>Use Firefox and add the <b>Violentmonkey</b> add-on.</li><li>Tap <b>Install Collector</b> and confirm the install.</li><li>Reload this page.</li></ol>
    <div style="font-weight:600">Mac</div>
    <ol><li>Safari with the <b>Userscripts</b> app (turn it on in Safari &gt; Settings &gt; Extensions), or Chrome / Firefox with Violentmonkey.</li><li>Click <b>Install Collector</b>, then the Userscripts toolbar icon, then <b>Install</b>.</li><li>Reload this page.</li></ol>
  </details>
  <div style="font-weight:600;margin-top:18px">Instagram username</div>
  <p style="margin-top:2px">Lets <b>Get new saves</b> go straight to your Saved posts. Filled in automatically after your first collect.</p>
  <input class="field" id="igu" placeholder="yourusername" value="${esc(state.igUser||"")}" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div style="font-weight:600;margin-top:18px">Your data</div>
  <div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn" id="sExport">Import Instagram export</button><button class="btn" id="sBackup">Backup &amp; restore</button></div>
  <p class="hint">Using it: tap <b>Get new saves</b>. Instagram opens to your Saved posts, the collector scrolls through, then brings you back here. To bring in one Instagram collection as a board, open that collection on Instagram and tap the collector's button there.</p>
  <div class="row"><button class="btn primary" data-x>Done</button></div>`,s=>{
    const saveUser=()=>{const v=s.querySelector("#igu").value.trim().replace(/^@/,"");if(v!==(state.igUser||"")){state.igUser=v;save()}};
    s.querySelector("[data-x]").onclick=()=>{saveUser();closeModal();render()};
    s.querySelector("#sExport").onclick=()=>{saveUser();exportModal()};
    s.querySelector("#sBackup").onclick=()=>{saveUser();backupModal()};
    s.addEventListener("mousedown",e=>{if(e.target===s){saveUser();render()}},true);
  });
}
function exportModal(){
  openModal(`<h3>Import Instagram export</h3>
  <p>Optional. Instagram's "Download your information" export includes the actual date you saved each post, so importing it makes the date sort exact. Request it in JSON format with <b>Saved</b> ticked, then drop the zip or the saved JSON files here.</p>
  <div class="drop-zone" id="dz">Drop files here, or tap to choose<input type="file" id="fi" multiple accept=".zip,.json" hidden></div>
  <div id="imsg" class="small" style="margin-top:10px"></div>
  <div class="row"><button class="btn ghost" data-x>Close</button></div>`,s=>{
    const dz=s.querySelector("#dz"),fi=s.querySelector("#fi"),msg=s.querySelector("#imsg");
    const handle=async files=>{if(!files||!files.length)return;msg.textContent="Reading...";
      try{const results=[];
        for(const f of files){
          if(/\.zip$/i.test(f.name)){const JSZip=await loadJSZip();const zip=await JSZip.loadAsync(f);
            const names=Object.keys(zip.files).filter(n=>/saved/i.test(n)&&/\.json$/i.test(n));
            if(!names.length)throw new Error("No saved-posts files in that zip. Make sure it's the JSON export with Saved included.");
            for(const n of names)results.push(parseExport(JSON.parse(await zip.files[n].async("string")),n));}
          else results.push(parseExport(JSON.parse(await f.text()),f.name));
        }
        let added=0,boards=0,found=0;results.forEach(r=>{found+=r.posts.length+r.collections.reduce((a,c)=>a+c.items.length,0);const x=mergeExport(r);added+=x.added;boards+=x.boardsMade});
        if(!found){msg.textContent="No saved posts found in that file.";return}
        render();msg.innerHTML=`<b style="color:var(--ink)">Done.</b> ${found.toLocaleString()} saves read, ${added.toLocaleString()} new${boards?`, ${boards} boards from your collections`:""}.`;
      }catch(e){msg.textContent=e.message||"Couldn't read that file."}};
    dz.onclick=()=>fi.click();fi.onchange=()=>handle([...fi.files]);
    dz.ondragover=e=>{e.preventDefault();dz.classList.add("over")};dz.ondragleave=()=>dz.classList.remove("over");
    dz.ondrop=e=>{e.preventDefault();dz.classList.remove("over");handle([...e.dataTransfer.files])};
    s.querySelector("[data-x]").onclick=closeModal;
  });
}
let jszipP=null;
function loadJSZip(){
  if(window.JSZip)return Promise.resolve(window.JSZip);
  if(!jszipP)jszipP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";s.onload=()=>res(window.JSZip);s.onerror=()=>{jszipP=null;rej(new Error("Couldn't load the zip reader. Unzip the export and choose the JSON files instead."))};document.head.appendChild(s)});
  return jszipP;
}
function detailModal(code){
  const p=state.posts[code];if(!p)return;const img=thumbs.get(code);
  openModal(`${img?`<img class="dimg" alt="" src="${img}">`:""}
    <h3 style="margin:0 0 2px">${esc(who(p)||TYPE_LABEL[p.k]||"Post")}</h3>
    <div class="small" style="margin-bottom:12px">${TYPE_LABEL[p.k]||"Post"}${p.t?` · saved ${esc(fmtDate(p.t))}`:""}</div>
    <a class="btn primary" href="${esc(postUrl(p))}" target="_blank" rel="noopener">Open on Instagram &#8599;</a>
    ${p.cap?`<p class="hint" style="margin-top:12px">${esc(p.cap)}</p>`:""}
    <div style="margin-top:14px;font-weight:600">Note</div>
    <textarea class="field" id="note" placeholder="What is this? e.g. 'chili crisp noodles'">${esc(p.n||"")}</textarea>
    <div style="margin-top:14px;font-weight:600">Boards</div>
    <div class="blist">${state.boards.map(b=>`<label><input type="checkbox" data-b="${esc(b.id)}" ${p.b.includes(b.id)?"checked":""}><span style="width:10px;height:10px;border-radius:3px;background:${b.color};display:inline-block"></span>${esc(b.name)}</label>`).join("")||`<span class="small">No boards yet.</span>`}</div>
    <button class="linkbtn" id="dNew" style="color:var(--accent);font-weight:600">+ New board</button>
    <div class="row"><button class="btn danger ghost" id="dDel">Delete</button><button class="btn primary" id="dDone">Done</button></div>`,s=>{
    const saveNote=()=>{const v=s.querySelector("#note").value;if(v!==(p.n||"")){p.n=v;save()}};
    s.querySelectorAll("[data-b]").forEach(cb=>cb.onchange=()=>{const id=cb.dataset.b;p.b=p.b.filter(x=>x!==id);if(cb.checked)p.b.push(id);save()});
    s.querySelector("#dDone").onclick=()=>{saveNote();closeModal();render()};
    s.querySelector("#dNew").onclick=()=>{saveNote();boardForm(null,b=>{p.b.push(b.id);save();setTimeout(()=>detailModal(code))})};
    s.querySelector("#dDel").onclick=()=>confirmBox("Delete this post?","It's only removed from this board app. It stays saved on Instagram, and the collector could bring it back on a full rescan.","Delete",()=>{delete state.posts[code];thumbs.delete(code);thumbDel([code]);save();hello();render()});
    s.addEventListener("mousedown",e=>{if(e.target===s){saveNote();render()}},true);
  });
}
function backupJSON(){return JSON.stringify({app:"saved-posts-board",v:2,exported:new Date().toISOString(),igUser:state.igUser,boards:state.boards,posts:Object.values(state.posts)})}
function backupModal(){
  openModal(`<h3>Backup &amp; restore</h3>
    <p>Everything is stored in this browser on this device. Save a backup now and then, especially on iPhone, where Safari can clear data for sites you haven't opened in a while. Thumbnails aren't included; they come back on the next collect.</p>
    <div class="row" style="justify-content:flex-start"><button class="btn" id="dl">Download backup</button><button class="btn" id="cp">Copy backup</button></div>
    <div style="margin-top:18px;font-weight:600">Restore</div>
    <p style="margin-top:2px">Replaces everything here with the backup.</p>
    <input type="file" id="rf" accept=".json,.txt">
    <div id="bmsg" class="small" style="margin-top:8px"></div>
    <div style="margin-top:18px;font-weight:600">Start over</div>
    <button class="btn danger" id="wipe" style="margin-top:6px">Clear all posts and boards</button>
    <div class="row"><button class="btn ghost" data-x>Close</button></div>`,s=>{
    const msg=s.querySelector("#bmsg");s.querySelector("[data-x]").onclick=closeModal;
    s.querySelector("#dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([backupJSON()],{type:"application/json"}));
      a.download="saved-posts-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);msg.textContent="Backup downloaded."};
    s.querySelector("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(backupJSON());msg.textContent="Copied. Paste it into a note to keep it."}catch(e){msg.textContent="Clipboard isn't available here."}};
    s.querySelector("#rf").onchange=async e=>{const f=e.target.files[0];if(!f)return;
      try{const d=JSON.parse(await f.text());if(d.app!=="saved-posts-board")throw 0;
        confirmBox("Restore this backup?",`It has ${d.posts.length.toLocaleString()} posts and ${d.boards.length} boards, and will replace what's here now.`,"Restore",()=>replaceAll(d))}
      catch(_){msg.textContent="That doesn't look like a backup from this app."}};
    s.querySelector("#wipe").onclick=()=>confirmBox("Clear everything?","All posts, boards and notes here will be removed. Nothing changes on Instagram.","Clear all",()=>replaceAll({boards:[],posts:[],igUser:state.igUser}));
  });
}
function replaceAll(d){
  const old=Object.keys(state.posts);
  state={boards:d.boards||[],posts:{},igUser:d.igUser||""};
  (d.posts||[]).forEach(p=>{state.posts[p.c]=newPost(p)});
  const gone=old.filter(c=>!state.posts[c]);gone.forEach(c=>thumbs.delete(c));thumbDel(gone);
  view.board="all";view.picked.clear();save();hello();render();toast("Done");
}
function boardMenu(id,x,y){
  closeMenu();const b=boardById(id);if(!b)return;
  const m=document.createElement("div");m.className="menu";m.id="menu";m.style.left=Math.min(x,innerWidth-170)+"px";m.style.top=y+"px";
  m.innerHTML=`<button data-a="edit">Rename or recolor</button><button data-a="del" style="color:#b91c1c">Delete board</button>`;
  document.body.appendChild(m);
  m.onclick=e=>{const a=e.target.dataset.a;closeMenu();
    if(a==="edit")boardForm(b);
    if(a==="del")confirmBox(`Delete "${b.name}"?`,"The posts on it stay here, they just come off this board.","Delete board",()=>{
      state.boards=state.boards.filter(x=>x.id!==id);Object.values(state.posts).forEach(p=>p.b=p.b.filter(x=>x!==id));save();render()})};
  setTimeout(()=>document.addEventListener("mousedown",closeMenuOutside),0);
}
function closeMenuOutside(e){const m=$("#menu");if(m&&!m.contains(e.target))closeMenu()}
function closeMenu(){const m=$("#menu");m&&m.remove();document.removeEventListener("mousedown",closeMenuOutside)}
function addToBoard(codes,boardId){
  let n=0;codes.forEach(c=>{const p=state.posts[c];if(p&&!p.b.includes(boardId)){p.b.push(boardId);n++}});save();
  const b=boardById(boardId);toast(n?`Added ${n} to ${b.name}`:`Already on ${b.name}`);render();
}

/* ---------------- events ---------------- */
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("[data-bmenu]")){e.stopPropagation();const r=t.getBoundingClientRect();boardMenu(t.closest("[data-bmenu]").dataset.bmenu,r.left,r.bottom+4);return}
  const nav=t.closest("[data-nav]");if(nav){view.board=nav.dataset.nav;view.limit=PAGE;view.picked.clear();render();return}
  if(t.id==="newBoard")return boardForm();
  if(t.id==="settingsBtn"||t.id==="setupBtn2")return settingsModal();
  if(t.id==="selBtn"){view.selecting=!view.selecting;view.picked.clear();render();return}
  if(t.id==="moreBtn"){view.limit+=PAGE;render();return}
  if(t.id==="bulkClear"){view.picked.clear();render();return}
  if(t.id==="bulkRemove"){const id=view.board;view.picked.forEach(c=>{const p=state.posts[c];if(p)p.b=p.b.filter(x=>x!==id)});save();toast(`Removed ${view.picked.size}`);view.picked.clear();render();return}
  if(t.id==="bulkDelete"){const n=view.picked.size;confirmBox(`Delete ${n} ${n===1?"post":"posts"}?`,"They're only removed from this board app, not from Instagram.","Delete",()=>{const codes=[...view.picked];codes.forEach(c=>{delete state.posts[c];thumbs.delete(c)});thumbDel(codes);view.picked.clear();save();hello();render()});return}
  const card=t.closest("[data-post]");
  if(card){const c=card.dataset.post;
    if(view.selecting){view.picked.has(c)?view.picked.delete(c):view.picked.add(c);card.classList.toggle("picked");
      const old=document.querySelector(".bulk");if(old)old.remove();if(view.picked.size)document.body.insertAdjacentHTML("beforeend",bulkHTML())}
    else detailModal(c)}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="sort"){view.sort=t.value;view.limit=PAGE;render()}
  if(t.id==="type"){view.type=t.value;view.limit=PAGE;render()}
  if(t.id==="bulkBoard"&&t.value){const codes=[...view.picked];
    if(t.value==="__new"){t.value="";boardForm(null,b=>addToBoard(codes,b.id))}else addToBoard(codes,t.value)}
});
let qTimer;
document.addEventListener("input",e=>{if(e.target.id==="q"){clearTimeout(qTimer);const v=e.target.value;qTimer=setTimeout(()=>{view.q=v;view.limit=PAGE;render();const q=$("#q");q.focus();q.setSelectionRange(v.length,v.length)},180)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeMenu();if($("#scrim")){closeModal();render()}}});
/* drag posts onto boards (desktop) */
let dragCodes=null;
document.addEventListener("dragstart",e=>{const card=e.target.closest&&e.target.closest("[data-post]");if(!card)return;
  const c=card.dataset.post;dragCodes=view.selecting&&view.picked.has(c)?[...view.picked]:[c];card.classList.add("dragging");
  e.dataTransfer.effectAllowed="copy";try{e.dataTransfer.setData("text/plain",c)}catch(_){}});
document.addEventListener("dragend",()=>{dragCodes=null;document.querySelectorAll(".dragging,.drop").forEach(x=>x.classList.remove("dragging","drop"))});

document.addEventListener("dragleave",e=>{const li=e.target.closest&&e.target.closest("[data-board]");if(li&&!li.contains(e.relatedTarget))li.classList.remove("drop")});
document.addEventListener("drop",e=>{const li=e.target.closest&&e.target.closest("[data-board]");if(li&&dragCodes){e.preventDefault();addToBoard(dragCodes,li.dataset.board);dragCodes=null}});
